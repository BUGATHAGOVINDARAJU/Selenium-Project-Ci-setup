name: PR Code Review Agent

on:
  pull_request:
    branches: [ main ]

jobs:
  review-code:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run PR Review Agent
      run: python .github/scripts/pr_reviewer.py